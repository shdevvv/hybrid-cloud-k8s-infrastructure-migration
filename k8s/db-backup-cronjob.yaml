apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-cronjob
  namespace: default
spec:
  # Berjalan setiap tengah malam (00:00)
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: db-backup-worker
              image: amazon/aws-cli:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "Memulai otomatisasi backup database ke MinIO Object Storage..."
                  TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                  BACKUP_FILE="/tmp/backup_${TIMESTAMP}.tar.gz"
                  
                  # Buat file backup dummy terenkripsi/terkompresi
                  echo "Snapshot MySQL database taken at ${TIMESTAMP}" > /tmp/db.sql
                  tar -czvf ${BACKUP_FILE} /tmp/db.sql
                  
                  # Upload ke MinIO S3 Compatible Storage
                  echo "Mengunggah backup ke MinIO S3 Storage..."
                  aws --endpoint-url=http://minio.default.svc.cluster.local:9000 s3 cp ${BACKUP_FILE} s3://database-backups/ || true
                  echo "Backup data selesai!"

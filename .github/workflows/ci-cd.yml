name: E-Commerce CI/CD

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint app/docker-compose.yml
          yamllint .github/workflows/ci-cd.yml

      - name: Validate Docker Compose
        run: docker compose -f app/docker-compose.yml config -q

      - name: Check application files
        run: |
          test -f app/frontend/Dockerfile
          test -f app/backend/Dockerfile
          test -f app/docker-compose.yml

  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-frontend:${{ github.sha }} \
            ./app/frontend

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-backend:${{ github.sha }} \
            ./app/backend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-frontend:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-backend:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-frontend:${{ github.sha }}

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-backend:${{ github.sha }}

      - name: Tag and push v1.0.0 images
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag \
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-frontend:${{ github.sha }} \
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-frontend:v1.0.0

          docker tag \
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-backend:${{ github.sha }} \
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-backend:v1.0.0

          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-frontend:v1.0.0
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce-backend:v1.0.0
